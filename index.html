    <script>
      // Defensive guard against browser extension interceptors and disabled Vite HMR WebSocket errors
      (function() {
        try {
          var realFetch = window.fetch;
          var currentFetch = realFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch || realFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        // Filter out Vite HMR WebSocket console errors in environments where HMR is disabled
        try {
          var origConsoleError = console.error;
          var origConsoleWarn = console.warn;
          var shouldSuppressLog = function(args) {
            for (var i = 0; i < args.length; i++) {
              var str = '';
              try {
                str = typeof args[i] === 'string' ? args[i] : (args[i] && args[i].message ? args[i].message : String(args[i]));
              } catch (_) {}
              if (
                str.indexOf('[vite] failed to connect to websocket') !== -1 ||
                str.indexOf('WebSocket closed without opened') !== -1 ||
                str.indexOf('vite-hmr') !== -1
              ) {
                return true;
              }
            }
            return false;
          };
          console.error = function() {
            if (shouldSuppressLog(arguments)) return;
            return origConsoleError.apply(console, arguments);
          };
          console.warn = function() {
            if (shouldSuppressLog(arguments)) return;
            return origConsoleWarn.apply(console, arguments);
          };
        } catch (e) {}

        // Prevent Vite HMR client from opening failing WebSocket connections when HMR is disabled
        try {
          var NativeWebSocket = window.WebSocket;
          if (NativeWebSocket) {
            var PatchedWebSocket = function(url, protocols) {
              var isViteHmr = false;
              try {
                if (protocols === 'vite-hmr' || protocols === 'vite-ping') {
                  isViteHmr = true;
                } else if (Array.isArray(protocols) && (protocols.indexOf('vite-hmr') !== -1 || protocols.indexOf('vite-ping') !== -1)) {
                  isViteHmr = true;
                }
              } catch (_) {}

              if (isViteHmr) {
                var dummyWs = {
                  url: url || '',
                  readyState: 1,
                  protocol: typeof protocols === 'string' ? protocols : 'vite-hmr',
                  extensions: '',
                  bufferedAmount: 0,
                  binaryType: 'blob',
                  onopen: null,
                  onerror: null,
                  onclose: null,
                  onmessage: null,
                  addEventListener: function(type, listener) {
                    if (type === 'open' && typeof listener === 'function') {
                      setTimeout(function() {
                        try { listener({ type: 'open', target: dummyWs }); } catch (_) {}
                      }, 10);
                    }
                  },
                  removeEventListener: function() {},
                  dispatchEvent: function() { return true; },
                  send: function() {},
                  close: function() { dummyWs.readyState = 3; }
                };
                setTimeout(function() {
                  if (typeof dummyWs.onopen === 'function') {
                    try { dummyWs.onopen({ type: 'open', target: dummyWs }); } catch (_) {}
                  }
                }, 10);
                return dummyWs;
              }

              if (arguments.length === 1) {
                return new NativeWebSocket(url);
              }
              return new NativeWebSocket(url, protocols);
            };
            PatchedWebSocket.prototype = NativeWebSocket.prototype;
            PatchedWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
            PatchedWebSocket.OPEN = NativeWebSocket.OPEN;
            PatchedWebSocket.CLOSING = NativeWebSocket.CLOSING;
            PatchedWebSocket.CLOSED = NativeWebSocket.CLOSED;
            window.WebSocket = PatchedWebSocket;
          }
        } catch (e) {}

        // Suppress unhandled extension and WebSocket errors (HMR in container proxy)
        window.addEventListener('unhandledrejection', function(e) {
          var reasonStr = '';
          try {
            reasonStr = e && e.reason ? (e.reason.message || String(e.reason)) : '';
          } catch (_) {}
          if (reasonStr && (
            reasonStr.indexOf('WebSocket') !== -1 ||
            reasonStr.indexOf('websocket') !== -1 ||
            reasonStr.indexOf('closed without opened') !== -1
          )) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('error', function(e) {
          var msg = '';
          try {
            msg = e && e.message ? String(e.message) : '';
          } catch (_) {}
          if (msg && (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('failed to connect to websocket') !== -1
          )) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
          if (e && e.filename && e.filename.indexOf('chrome-extension://') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
          if (msg && msg.indexOf('Cannot set property fetch of #<Window>') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
