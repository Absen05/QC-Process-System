    <script>
      // Defensive guard against browser extension interceptors attempting to assign to window.fetch
      (function() {
        try {
          var realFetch = window.fetch;
          var currentFetch = realFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch || realFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        // Suppress unhandled extension errors from propagating to application error listeners
        window.addEventListener('error', function(e) {
          if (e && e.filename && e.filename.indexOf('chrome-extension://') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
          if (e && e.message && e.message.indexOf('Cannot set property fetch of #<Window>') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
