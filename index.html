    <script>
      // Defensive guard against browser extension interceptors attempting to assign to window.fetch
      (function() {
        try {
          var realFetch = window.fetch;
          var currentFetch = realFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch || realFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        // Suppress unhandled extension and WebSocket errors (HMR in container proxy)
        window.addEventListener('unhandledrejection', function(e) {
          var reasonStr = '';
          try {
            reasonStr = e && e.reason ? (e.reason.message || String(e.reason)) : '';
          } catch (_) {}
          if (reasonStr && (
            reasonStr.indexOf('WebSocket') !== -1 ||
            reasonStr.indexOf('websocket') !== -1 ||
            reasonStr.indexOf('closed without opened') !== -1
          )) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('error', function(e) {
          var msg = '';
          try {
            msg = e && e.message ? String(e.message) : '';
          } catch (_) {}
          if (msg && (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('failed to connect to websocket') !== -1
          )) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
          if (e && e.filename && e.filename.indexOf('chrome-extension://') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
          if (msg && msg.indexOf('Cannot set property fetch of #<Window>') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
